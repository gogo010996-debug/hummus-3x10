<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7cb3d" />
    <meta name="description" content="حمص الـ٣ بـ١٠" />
    <title>حمص الـ٣ بـ١٠</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Tahoma, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.7) 0 8%, transparent 9%),
          radial-gradient(circle at 84% 78%, rgba(255, 255, 255, 0.45) 0 11%, transparent 12%),
          linear-gradient(145deg, #ffe680 0%, #f7c83d 45%, #a8cc59 100%);
      }

      .hero {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 100svh;
        isolation: isolate;
        padding: clamp(18px, 4vw, 52px);
      }

      .hero::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: min(78vw, 850px);
        aspect-ratio: 1;
        border: clamp(18px, 3vw, 38px) solid rgba(255, 255, 255, 0.32);
        border-radius: 50%;
        box-shadow: 0 0 0 clamp(12px, 2vw, 26px) rgba(56, 113, 54, 0.12);
      }

      .poster {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 1050px);
        text-align: center;
      }

      h1 {
        position: relative;
        z-index: 2;
        margin: 0 0 clamp(-18px, -1vw, -6px);
        color: #fff;
        font-size: clamp(3rem, 10vw, 8.5rem);
        font-weight: 900;
        line-height: 0.92;
        letter-spacing: -0.05em;
        text-wrap: balance;
        -webkit-text-stroke: clamp(2px, 0.45vw, 6px) #246b35;
        paint-order: stroke fill;
        filter: drop-shadow(0 10px 0 #d59019) drop-shadow(0 18px 20px rgba(62, 48, 10, 0.25));
        transform: rotate(-2deg);
      }

      .product {
        display: block;
        width: min(92vw, 820px);
        max-height: 62svh;
        object-fit: contain;
        filter: drop-shadow(0 26px 22px rgba(57, 65, 19, 0.35));
        transform: rotate(1deg);
        animation: float 3.8s ease-in-out infinite;
      }

      .spark {
        position: absolute;
        color: #fff;
        font-size: clamp(2rem, 6vw, 5rem);
        font-weight: 900;
        text-shadow: 0 5px 0 #d59019;
        animation: twinkle 1.8s ease-in-out infinite alternate;
      }

      .spark.one {
        top: 12%;
        left: 8%;
      }

      .spark.two {
        right: 9%;
        bottom: 14%;
        animation-delay: -0.8s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(1deg);
        }
        50% {
          transform: translateY(-12px) rotate(-1deg);
        }
      }

      @keyframes twinkle {
        from {
          opacity: 0.45;
          transform: scale(0.85) rotate(-8deg);
        }
        to {
          opacity: 1;
          transform: scale(1.15) rotate(8deg);
        }
      }

      @media (max-width: 560px) {
        h1 {
          margin-bottom: -4px;
          font-size: clamp(3.15rem, 18vw, 5.4rem);
        }

        .product {
          width: 112vw;
          max-width: none;
          max-height: 56svh;
        }

        .spark.one {
          top: 8%;
          left: 5%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .product,
        .spark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero" aria-label="حمص الثلاثة بعشرة">
      <span class="spark one" aria-hidden="true">✦</span>
      <span class="spark two" aria-hidden="true">✦</span>
      <section class="poster">
        <h1>حمص الـ٣ بـ١٠</h1>
        <img class="product" src="hummus.webp" alt="علبة حمص" />
      </section>
    </main>
  </body>
</html>
