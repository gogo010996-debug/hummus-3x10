<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b0904" />
    <meta name="description" content="كولا الـ٣ بـ١٠" />
    <title>كولا الـ٣ بـ١٠</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Tahoma, Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #2b0302;
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: start center;
        overflow: hidden;
        padding: clamp(30px, 7vh, 76px) 18px;
        background:
          linear-gradient(180deg, rgba(18, 0, 0, 0.42) 0%, transparent 42%, rgba(8, 0, 0, 0.18) 100%),
          url("cola-hero.jpg") center center / cover no-repeat;
        isolation: isolate;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at 50% 24%, rgba(255, 77, 38, 0.18), transparent 42%);
        pointer-events: none;
      }

      h1 {
        margin: 0;
        padding: 0.08em 0.28em 0.18em;
        color: #fff7e8;
        font-size: clamp(3.3rem, 10vw, 9.2rem);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.055em;
        text-align: center;
        text-wrap: balance;
        -webkit-text-stroke: clamp(1.5px, 0.35vw, 5px) #6e0905;
        paint-order: stroke fill;
        filter: drop-shadow(0 8px 0 #b92212) drop-shadow(0 18px 26px rgba(0, 0, 0, 0.65));
        animation: pop 3.6s ease-in-out infinite;
      }

      @keyframes pop {
        0%, 100% { transform: rotate(-1.2deg) scale(1); }
        50% { transform: rotate(1deg) scale(1.025); }
      }

      @media (max-width: 700px) {
        .hero {
          padding-top: clamp(34px, 8vh, 70px);
          background-position: center center;
        }

        h1 {
          max-width: 96vw;
          font-size: clamp(3.2rem, 18vw, 6.4rem);
          line-height: 0.9;
        }
      }

      @media (orientation: portrait) and (max-width: 700px) {
        .hero { background-size: auto 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="hero" aria-label="كولا الثلاثة بعشرة">
      <h1>كولا الـ٣ بـ١٠</h1>
    </main>
  </body>
</html>
